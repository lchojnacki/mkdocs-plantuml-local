repos:
  - repo: local
    hooks:
      - id: mixed-line-ending
        name: mixed-line-ending
        entry: poetry run mixed-line-ending
        language: system
        types: [text]
      - id: detect-private-key
        name: detect-private-key
        entry: poetry run detect-private-key
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: end-of-file-fixer
        entry: poetry run end-of-file-fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: trailing-whitespace
        entry: poetry run trailing-whitespace-fixer
        language: system
        types: [text]
      - id: ruff
        name: ruff
        entry: poetry run ruff check --force-exclude --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: poetry run ruff format --force-exclude
        language: system
        types: [python]
      - id: docformatter
        name: docformatter
        entry: poetry run docformatter --in-place --wrap-summaries=80 --wrap-descriptions=80 --pre-summary-newline
        language: system
        types: [python]

[tool.poetry]
name = "mkdocs-plantuml-local"
version = "0.5.0"
description = "Render PlantUML diagrams without sending sensitive data to a public server"
authors = ["Lawrence <lawrence@acode.ninja>"]
homepage = "https://github.com/acodeninja/mkdocs-plantuml-local"
license = "MIT"
readme = "README.md"

packages = [
    { include = "mkdocs_plantuml_local" }
]
include = [
    { path = "mkdocs_plantuml_local/plantuml.jar", format = ["sdist", "wheel"] }
]

[tool.poetry.plugins."mkdocs.plugins"]
"plantuml-local" = "mkdocs_plantuml_local.plugin:MkDocsPluginPlantUMLLocal"

[tool.poetry.build]
generate-setup-file = false
script = "build.py"

[tool.poetry.dependencies]
python = ">= 3.11,<4.0"
mkdocs = ">= 1.5.0"
lxml = ">= 5.1.0"
cssselect = "^1.2.0"
pymdown-extensions = ">= 10.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.2"
pyfakefs = "^5.3.5"
pre-commit = "^3.6.2"
nox = "^2026.10.20"


[tool.poetry.group.lint.dependencies]
pre-commit-hooks = "^6.0.0"
ruff = "^0.17.5"
docformatter = "^1.7.8"

[tool.ruff.lint]
# autoflake's unused imports/variables (F401/F841) are in the default F set
extend-select = [
    "A",  # flake8-builtins
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",  # pycodestyle errors
    "FLY",  # flynt: static str.join to f-string
    "I",  # isort
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "SIM",  # flake8-simplify
    "UP",  # pyupgrade, incl. flynt's UP031 (% formatting) and UP032 (.format())
    "W",  # pycodestyle warnings
]

[tool.ruff.lint.isort]
force-single-line = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
